name: mlsyseng-moe
version: "0.1.0"
description: >
  Machine Learning Systems Expert Mixture of Experts.
  Extracts knowledge from ML Principles PDFs, registers chapter experts
  with skills/strategy/formulas, and builds Kaggle competition entries
  using RAG-informed skill selection with state convergence loops.

mcp_server:
  command: python
  args: ["-m", "mlsyseng_mcp.server"]
  working_directory: ~/mcp-servers/mlsyseng-moe
  env:
    ML_PRINCIPLES_PATH: ~/Desktop/Machine Learning Principles - Chapters
    SQLITE_DB_PATH: ~/.mlsyseng/mlsyseng.db
    CHROMA_DB_PATH: ~/.mlsyseng/chroma_db
    KAGGLE_SKILLS_PATH: ~/skills

tools:
  - name: extract-knowledge
    description: Extract PDFs, index chapters, create experts
    parameters:
      force_reindex:
        type: boolean
        default: false
        description: Re-extract already completed chapters

  - name: evolve
    description: Run convergence loop for a competition
    parameters:
      competition:
        type: string
        default: titanic
        description: Kaggle competition slug

  - name: search-concepts
    description: Semantic search over ML Principles
    parameters:
      query:
        type: string
        description: Search query
      n_results:
        type: integer
        default: 5

  - name: list-experts
    description: List all chapter experts

  - name: build-entry
    description: Build competition entry using expert knowledge
    parameters:
      competition:
        type: string
        default: titanic

  - name: run-rdagent
    description: Run rdagent with ML Principles context
    parameters:
      competition_name:
        type: string
      description:
        type: string
        default: ""

  - name: ask-expert
    description: Query a specific chapter expert
    parameters:
      expert_slug:
        type: string
      question:
        type: string

  - name: get-extraction-status
    description: Check extraction progress

  - name: get-stats
    description: System statistics

platforms:
  openclaw:
    skill_path: ~/.openclaw/workspace/skills/mlsyseng/
    config_path: ~/.openclaw/openclaw.json

  claude_desktop:
    config_path: ~/Library/Application Support/Claude/claude_desktop_config.json

  cursor:
    skill_path: ~/.cursor/skills/mlsyseng/

  gemini:
    config_path: ~/.gemini/mcp_config.json

  generic:
    skill_path: ~/.skills/mlsyseng/
