# MLSysEng MoE - Skills Definition
# Source of truth for all platform skill configurations

name: mlsyseng-moe
version: "0.1.0"
description: >
  Machine Learning Systems Expert Mixture of Experts system.
  Extracts knowledge from ML Principles PDFs, registers chapter experts
  with skills/strategy/formulas, and builds Kaggle competition entries
  using RAG-informed skill selection with state convergence loops.

mcp_server:
  command: python
  args:
    - "-m"
    - "mlsyseng_mcp.server"
  working_directory: "${WORKSPACE_ROOT}"
  env:
    ML_PRINCIPLES_PATH: "${ML_PRINCIPLES_PATH:-~/Desktop/Machine Learning Principles - Chapters}"
    SQLITE_DB_PATH: "${SQLITE_DB_PATH:-~/.mlsyseng/mlsyseng.db}"
    CHROMA_DB_PATH: "${CHROMA_DB_PATH:-~/.mlsyseng/chroma_db}"
    KAGGLE_SKILLS_PATH: "${KAGGLE_SKILLS_PATH:-~/skills}"

tools:
  - name: extract-knowledge
    description: "Extract PDFs, index chapters, create experts"
    parameters:
      force_reindex:
        type: boolean
        default: false

  - name: evolve
    description: "Run full evolution pipeline with convergence loop"
    parameters:
      competition:
        type: string
        default: "titanic"

  - name: search-concepts
    description: "Semantic search over ML Principles"
    parameters:
      query:
        type: string
        required: true
      n_results:
        type: integer
        default: 5

  - name: list-experts
    description: "List all chapter experts"

  - name: build-entry
    description: "Build competition entry using expert knowledge"
    parameters:
      competition:
        type: string
        default: "titanic"

  - name: run-rdagent
    description: "Run rdagent with ML Principles context"
    parameters:
      competition:
        type: string
        required: true
      description:
        type: string
        default: ""

  - name: ask-expert
    description: "Query specific chapter expert"
    parameters:
      expert_slug:
        type: string
        required: true
      question:
        type: string
        required: true

  - name: get-extraction-status
    description: "Check extraction progress"

  - name: get-stats
    description: "System statistics"

platforms:
  openclaw:
    skill_path: "~/.openclaw/workspace/skills/mlsyseng/"
    config_path: "~/.openclaw/openclaw.json"

  claude_desktop:
    config_path: "~/Library/Application Support/Claude/claude_desktop_config.json"

  cursor:
    skill_path: "~/.cursor/skills/mlsyseng/"

  gemini:
    config_path: "~/.gemini/mcp_config.json"

  generic:
    skill_path: "~/.skills/mlsyseng/"

skill_content: |
  # MLSysEng MoE - ML Systems Expert

  ## Overview
  Machine Learning Systems Expert Mixture of Experts system that extracts
  knowledge from ML Principles PDFs and builds Kaggle competition entries
  using RAG-informed expert skill selection.

  ## Available Tools
  - `extract-knowledge`: Extract and index ML Principles PDFs
  - `evolve`: Run full pipeline with state convergence loop
  - `search-concepts`: Semantic search over indexed knowledge
  - `list-experts`: View registered chapter experts
  - `build-entry`: Generate competition entry plan
  - `run-rdagent`: Prepare rdagent context with ML knowledge
  - `ask-expert`: Query a specific expert

  ## Usage
  1. First run `extract-knowledge` to index your ML Principles PDFs
  2. Use `list-experts` to see available chapter experts
  3. Use `build-entry` with a competition name to generate a solution plan
  4. Run `evolve` to execute the convergence loop

  ## Expert System
  Each chapter becomes an expert with:
  - Capabilities (what they can help with)
  - Skills (Kaggle-specific tool references)
  - Strategy (step-by-step approach)
  - Formula (optimization objective)
  - Loop Config (convergence parameters)
