# MLSysEng MoE - Skills Definition
# Source of truth for all platform skill configurations.

name: mlsyseng-moe
version: "0.1.0"
description: |
  Machine Learning Systems Expert Mixture of Experts.
  Extracts knowledge from ML Principles PDFs, registers chapter experts
  with skills/strategy/formulas, and builds Kaggle competition entries
  using RAG-informed skill selection with state convergence loops.

mcp_server:
  command: python
  args: ["-m", "mlsyseng_mcp.server"]
  env:
    ML_PRINCIPLES_PATH: "${ML_PRINCIPLES_PATH:-~/Desktop/Machine Learning Principles - Chapters}"
    SQLITE_DB_PATH: "${SQLITE_DB_PATH:-~/.openclaw/workspace/mlsyseng/mlsyseng.db}"
    CHROMA_DB_PATH: "${CHROMA_DB_PATH:-~/.openclaw/workspace/mlsyseng/chroma_db}"
    KAGGLE_SKILLS_PATH: "${KAGGLE_SKILLS_PATH:-~/skills}"

tools:
  - name: extract-knowledge
    description: Extract PDFs, index chapters, create experts
    alias: evolve

  - name: search-concepts
    description: Semantic search over ML Principles

  - name: list-experts
    description: List all chapter experts

  - name: build-entry
    description: Build competition entry using expert knowledge

  - name: run-rdagent
    description: Run rdagent with ML Principles context

  - name: get-extraction-status
    description: Check extraction progress

  - name: get-stats
    description: System statistics

platforms:
  openclaw:
    skill_path: "~/.openclaw/workspace/skills/mlsyseng/"
    config_path: "~/.openclaw/openclaw.json"
    skill_file: SKILL.md

  claude_desktop:
    config_path: "~/Library/Application Support/Claude/claude_desktop_config.json"

  cursor:
    skill_path: "~/.cursor/skills/mlsyseng/"
    skill_file: SKILL.md

  gemini:
    config_path: "~/.gemini/mcp_config.json"

  generic:
    skill_path: "~/.skills/mlsyseng/"
    skill_file: SKILL.md

skill_content: |
  # MLSysEng MoE - ML Systems Expert

  A Mixture of Experts system for ML competition solving.

  ## Available Tools

  - `extract-knowledge`: Extract and index ML Principles PDFs
  - `search-concepts`: Semantic search over indexed knowledge
  - `list-experts`: Show all registered chapter experts
  - `build-entry`: Build a competition entry plan
  - `run-rdagent`: Generate rdagent context with ML knowledge
  - `evolve`: Run convergence loop on a competition
  - `get-extraction-status`: Check indexing progress
  - `get-stats`: System statistics

  ## Workflow

  1. Run `extract-knowledge` to index PDF chapters
  2. Use `search-concepts` to find relevant knowledge
  3. Run `build-entry` for a competition plan
  4. Use `evolve` to iteratively improve solutions

  ## Expert System

  Each chapter becomes an expert with:
  - Capabilities (what it can do)
  - Skills (Kaggle skill paths)
  - Strategy (step-by-step approach)
  - Formula (objective function + metrics)
  - Loop config (convergence parameters)

  ## Convergence Loop

  Exit condition: `||state[n] - state[n-1]||_2 < epsilon`
  - Default epsilon: 0.001
  - Default patience: 3 consecutive converging iterations
  - Default max iterations: 10
