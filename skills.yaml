# MLSysEng MoE - Skills Definition
# Source of truth for all platform skill configurations

name: mlsyseng-moe
version: "0.1.0"
description: >
  Mixture of Experts system that extracts knowledge from ML Principles PDFs,
  registers chapter experts with skills/strategy/formulas, and builds Kaggle
  competition entries using RAG-informed skill selection with state convergence loops.

mcp_server:
  command: python
  args:
    - "-m"
    - "mlsyseng_mcp.server"
  env:
    ML_PRINCIPLES_PATH: "${ML_PRINCIPLES_PATH:-~/Desktop/Machine Learning Principles - Chapters}"
    SQLITE_DB_PATH: "${SQLITE_DB_PATH:-~/.openclaw/workspace/mlsyseng/mlsyseng.db}"
    CHROMA_DB_PATH: "${CHROMA_DB_PATH:-~/.openclaw/workspace/mlsyseng/chroma_db}"
    KAGGLE_SKILLS_PATH: "${KAGGLE_SKILLS_PATH:-~/skills}"

tools:
  - name: extract-knowledge
    description: Extract PDFs, index chapters, create experts
    alias: evolve

  - name: search-concepts
    description: Semantic search over ML Principles

  - name: list-experts
    description: List all chapter experts

  - name: build-entry
    description: Build competition entry using expert knowledge

  - name: run-rdagent
    description: Run rdagent with ML Principles context

  - name: ask-expert
    description: Query a specific chapter expert

  - name: get-extraction-status
    description: Check extraction progress

  - name: get-stats
    description: System statistics

skill:
  name: MLSysEng MoE Expert
  instructions: |
    You are an ML Systems Engineering expert with access to a Mixture of Experts
    system built on ML Principles chapters.

    ## Available Tools

    1. **extract-knowledge**: Extract PDFs and index chapters. Run this first.
    2. **search-concepts**: Search the knowledge base semantically.
    3. **list-experts**: See all available chapter experts.
    4. **build-entry**: Generate a competition entry plan.
    5. **run-rdagent**: Get rdagent context from principles.
    6. **ask-expert**: Query a specific chapter expert.
    7. **get-extraction-status**: Check progress of extraction.
    8. **get-stats**: View system statistics.

    ## Workflow

    1. Start by running `extract-knowledge` to index all chapters.
    2. Use `search-concepts` to find relevant knowledge.
    3. Use `build-entry` to create a competition plan.
    4. The system uses a convergence loop: `||state[n] - state[n-1]||_2 < epsilon`

    ## Expert System

    Each chapter becomes an expert with:
    - Capabilities (what it can do)
    - Skills (Kaggle skill paths)
    - Strategy (Baseline → EDA → Feature Eng → Model → Submit)
    - Formula (objective function with metrics)
    - Loop config (convergence parameters)

platforms:
  openclaw:
    skill_dir: "~/.openclaw/workspace/skills/mlsyseng"
    config_file: "~/.openclaw/openclaw.json"
  claude_desktop:
    config_file: "~/Library/Application Support/Claude/claude_desktop_config.json"
  cursor:
    skill_dir: "~/.cursor/skills/mlsyseng"
  gemini:
    config_file: "~/.gemini/mcp_config.json"
  generic:
    skill_dir: "~/.skills/mlsyseng"
