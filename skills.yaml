# MLSysEng MoE Skills Definition
# Source of truth for all platform skill configurations

name: mlsyseng-moe
version: "0.1.0"
description: >
  Machine Learning Systems Expert Mixture of Experts.
  Extracts knowledge from ML Principles PDFs, registers chapter experts,
  and builds Kaggle competition entries using RAG-informed skill selection
  with state convergence loops.

mcp_server:
  command: python
  args:
    - -m
    - mlsyseng_mcp.server
  env:
    ML_PRINCIPLES_PATH: "${ML_PRINCIPLES_PATH:-~/Desktop/Machine Learning Principles - Chapters}"
    SQLITE_DB_PATH: "${SQLITE_DB_PATH:-~/.openclaw/workspace/mlsyseng/mlsyseng.db}"
    CHROMA_DB_PATH: "${CHROMA_DB_PATH:-~/.openclaw/workspace/mlsyseng/chroma_db}"
    KAGGLE_SKILLS_PATH: "${KAGGLE_SKILLS_PATH:-~/skills}"

tools:
  - name: extract-knowledge
    description: Extract PDFs, index chapters, create experts
    params:
      force_reindex:
        type: boolean
        default: false
        description: Force re-extraction of all chapters

  - name: evolve
    description: Run state convergence loop for a competition
    params:
      competition:
        type: string
        required: true
        description: Competition name/slug
      max_iterations:
        type: integer
        default: 10
      epsilon:
        type: float
        default: 0.001

  - name: search-concepts
    description: Semantic search over ML Principles
    params:
      query:
        type: string
        required: true
      n_results:
        type: integer
        default: 5

  - name: list-experts
    description: List all chapter experts

  - name: build-entry
    description: Build competition entry using expert knowledge
    params:
      competition:
        type: string
        required: true

  - name: run-rdagent
    description: Run rdagent with ML Principles context
    params:
      competition:
        type: string
        required: true
      description:
        type: string
        default: ""

  - name: ask-expert
    description: Query a specific chapter expert
    params:
      expert_slug:
        type: string
        required: true
      question:
        type: string
        required: true

  - name: get-extraction-status
    description: Check extraction progress

  - name: get-stats
    description: System statistics

skill_platforms:
  openclaw:
    install_path: "~/.openclaw/workspace/skills/mlsyseng"
    skill_file: SKILL.md
    config_file: "~/.openclaw/openclaw.json"

  cursor:
    install_path: "~/.cursor/skills/mlsyseng"
    skill_file: SKILL.md

  claude_desktop:
    config_file: "~/Library/Application Support/Claude/claude_desktop_config.json"

  gemini:
    config_file: "~/.gemini/mcp_config.json"

  generic:
    install_path: "~/.skills/mlsyseng"
    skill_file: SKILL.md

expert_defaults:
  strategy: "Baseline → EDA → Feature Engineering → Model Selection → Submit"
  loop_config:
    objective: minimize_validation_loss
    exit_condition: "||state[n] - state[n-1]||_2 < epsilon"
    epsilon: 0.001
    max_iterations: 10
    patience: 3
  formula:
    objective: minimize_validation_loss
    function: "L = f(X, θ, α)"
    metrics:
      - accuracy
      - f1_score
