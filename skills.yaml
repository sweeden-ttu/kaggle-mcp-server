# MLSysEng MoE Skills Configuration
# Source of truth for all platform-specific skill generation

name: mlsyseng-moe
version: "0.1.0"
description: >
  Machine Learning Systems Expert Mixture of Experts.
  Extracts knowledge from ML Principles PDFs, registers chapter experts,
  and builds Kaggle competition entries using RAG-informed skill selection
  with state convergence loops.

mcp_server:
  command: python
  args:
    - -m
    - mlsyseng_mcp.server
  env:
    ML_PRINCIPLES_PATH: "${ML_PRINCIPLES_PATH:-~/Desktop/Machine Learning Principles - Chapters}"
    SQLITE_DB_PATH: "${SQLITE_DB_PATH:-~/.mlsyseng/mlsyseng.db}"
    CHROMA_DB_PATH: "${CHROMA_DB_PATH:-~/.mlsyseng/chroma_db}"
    KAGGLE_SKILLS_PATH: "${KAGGLE_SKILLS_PATH:-~/skills}"

tools:
  - name: extract-knowledge
    description: >
      Extract PDFs, index chapters, create experts.
      Scans ML Principles chapter folders, extracts PDF content using docling,
      generates embeddings, and creates expert definitions.
    parameters:
      force_reindex:
        type: boolean
        default: false
        description: Re-extract even if chapters are already indexed

  - name: evolve
    description: >
      Run state convergence loop for a competition.
      Iteratively optimizes until ||state[n] - state[n-1]||_2 < epsilon.
    parameters:
      competition:
        type: string
        default: titanic
      max_iterations:
        type: integer
        default: 10

  - name: search-concepts
    description: Semantic search over ML Principles knowledge base
    parameters:
      query:
        type: string
        required: true
      n_results:
        type: integer
        default: 5

  - name: list-experts
    description: List all registered chapter experts with capabilities and formulas

  - name: ask-expert
    description: Query a specific chapter expert
    parameters:
      expert_slug:
        type: string
        required: true
      question:
        type: string
        required: true

  - name: build-entry
    description: Build competition entry using expert knowledge and RAG
    parameters:
      competition:
        type: string
        default: titanic

  - name: run-rdagent
    description: Run rdagent with ML Principles context
    parameters:
      competition:
        type: string
        default: titanic
      description:
        type: string
        default: ""

  - name: get-extraction-status
    description: Check extraction progress
    parameters:
      job_id:
        type: string
        default: ""

  - name: get-stats
    description: System statistics (chapters, experts, embeddings)

platforms:
  openclaw:
    skill_path: "~/.openclaw/workspace/skills/mlsyseng/"
    config_path: "~/.openclaw/openclaw.json"
    skill_file: SKILL.md

  claude_desktop:
    config_path: "~/Library/Application Support/Claude/claude_desktop_config.json"

  cursor:
    skill_path: "~/.cursor/skills/mlsyseng/"
    skill_file: SKILL.md

  gemini:
    config_path: "~/.gemini/mcp_config.json"

  generic:
    skill_path: "~/.skills/mlsyseng/"
    skill_file: SKILL.md
