# MLSysEng MoE - Skills Configuration
# Source of truth for all platform-specific skill installations

name: mlsyseng-moe
version: "0.1.0"
description: >
  Mixture of Experts system that extracts knowledge from ML Principles PDFs,
  registers chapter experts with skills/strategy/formulas, and builds Kaggle
  competition entries using RAG-informed skill selection with state convergence loops.

mcp_server:
  name: mlsyseng-moe
  command: python
  args:
    - "-m"
    - "src.mlsyseng_mcp.server"
  env:
    ML_PRINCIPLES_PATH: "${ML_PRINCIPLES_PATH:-~/Desktop/Machine Learning Principles - Chapters}"
    SQLITE_DB_PATH: "${SQLITE_DB_PATH:-~/.mlsyseng/mlsyseng.db}"
    CHROMA_DB_PATH: "${CHROMA_DB_PATH:-~/.mlsyseng/chroma_db}"
    KAGGLE_SKILLS_PATH: "${KAGGLE_SKILLS_PATH:-/skills}"

tools:
  - name: extract-knowledge
    description: "Extract PDFs, index chapters, create experts"
    alias: evolve
  - name: search-concepts
    description: "Semantic search over ML Principles"
  - name: list-experts
    description: "List all chapter experts"
  - name: build-entry
    description: "Build competition entry using expert knowledge"
  - name: run-rdagent
    description: "Run rdagent with ML Principles context"
  - name: ask-expert
    description: "Query specific chapter expert"
  - name: get-extraction-status
    description: "Check extraction progress"
  - name: get-stats
    description: "System statistics"

skill:
  name: MLSysEng MoE Expert System
  instruction: >
    You are an ML Systems Engineering expert powered by extracted knowledge from
    ML Principles chapters. Use the MCP tools to:
    
    1. Extract knowledge from PDFs with `extract-knowledge`
    2. Search concepts with `search-concepts`
    3. List available experts with `list-experts`
    4. Build competition entries with `build-entry`
    5. Run convergence loops with `evolve`
    6. Query specific experts with `ask-expert`
    
    Each expert has:
    - Capabilities derived from their chapter content
    - Skills mapped to Kaggle competition tasks
    - A strategy (Baseline → Feature Eng → Model → Submit)
    - An objective function (e.g., minimize_validation_loss)
    - A convergence loop config (L2 norm exit condition)

  when_to_use:
    - Building Kaggle competition entries
    - Selecting ML strategies for a problem
    - Searching ML principles and concepts
    - Running iterative model improvement loops

platforms:
  openclaw:
    skill_path: "~/.openclaw/workspace/skills/mlsyseng"
    config_path: "~/.openclaw/openclaw.json"
  claude_desktop:
    config_path: "~/Library/Application Support/Claude/claude_desktop_config.json"
  cursor:
    skill_path: "~/.cursor/skills/mlsyseng"
  gemini:
    config_path: "~/.gemini/mcp_config.json"
  generic:
    skill_path: "~/.skills/mlsyseng"
