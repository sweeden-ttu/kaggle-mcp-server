# MLSysEng MoE - Skills Definition
# Source of truth for all platform skill configurations

name: mlsyseng-moe
version: "0.1.0"
description: >
  Mixture of Experts system that extracts knowledge from ML Principles PDFs,
  registers chapter experts with skills/strategy/formulas, and builds Kaggle
  competition entries using RAG-informed skill selection with state convergence loops.

mcp_server:
  command: python
  args:
    - -m
    - mlsyseng_moe.mlsyseng_mcp.server
  env:
    ML_PRINCIPLES_PATH: "${ML_PRINCIPLES_PATH:-~/Desktop/Machine Learning Principles - Chapters}"
    SQLITE_DB_PATH: "${SQLITE_DB_PATH:-~/.openclaw/workspace/mlsyseng/mlsyseng.db}"
    CHROMA_DB_PATH: "${CHROMA_DB_PATH:-~/.openclaw/workspace/mlsyseng/chroma_db}"
    KAGGLE_SKILLS_PATH: "${KAGGLE_SKILLS_PATH:-~/skills}"

tools:
  - name: extract-knowledge
    description: "Extract PDFs, index chapters, create experts"
    aliases: ["evolve"]
    parameters:
      force_reindex:
        type: boolean
        default: false
        description: "Re-extract already completed chapters"

  - name: search-concepts
    description: "Semantic search over ML Principles"
    parameters:
      query:
        type: string
        required: true
        description: "Natural language search query"
      n_results:
        type: integer
        default: 5
        description: "Number of results to return"

  - name: list-experts
    description: "List all chapter experts"

  - name: build-entry
    description: "Build competition entry using expert knowledge"
    parameters:
      competition:
        type: string
        default: "titanic"
        description: "Competition name/slug"

  - name: run-rdagent
    description: "Run rdagent with ML Principles context"
    parameters:
      competition:
        type: string
        default: "titanic"
      description:
        type: string
        default: ""

  - name: ask-expert
    description: "Query specific chapter expert"
    parameters:
      expert_slug:
        type: string
        required: true
      question:
        type: string
        required: true

  - name: get-extraction-status
    description: "Check extraction progress"

  - name: get-stats
    description: "System statistics"

  - name: evolve
    description: "Run state convergence loop for competition"
    parameters:
      competition:
        type: string
        default: "titanic"

platforms:
  openclaw:
    skill_path: "~/.openclaw/workspace/skills/mlsyseng"
    config_path: "~/.openclaw/openclaw.json"

  claude_desktop:
    config_path: "~/Library/Application Support/Claude/claude_desktop_config.json"

  cursor:
    skill_path: "~/.cursor/skills/mlsyseng"

  gemini:
    config_path: "~/.gemini/mcp_config.json"

  generic:
    skill_path: "~/.skills/mlsyseng"

skill_content: |
  # MLSysEng MoE - ML Systems Expert Mixture of Experts

  ## Overview
  A Mixture of Experts (MoE) system that extracts knowledge from ML Principles PDFs,
  registers chapter experts with skills/strategy/formulas, and builds Kaggle competition
  entries using RAG-informed skill selection with state convergence loops.

  ## Available Tools

  ### Knowledge Management
  - `extract-knowledge`: Extract PDFs and index chapters into the knowledge base
  - `search-concepts`: Semantic search over indexed ML Principles
  - `get-extraction-status`: Check extraction progress
  - `get-stats`: Get system statistics

  ### Expert System
  - `list-experts`: List all registered chapter experts
  - `ask-expert`: Query a specific chapter expert with a question

  ### Competition Building
  - `build-entry`: Build a competition entry using expert knowledge and RAG
  - `evolve`: Run the state convergence loop for iterative improvement
  - `run-rdagent`: Run rdagent with ML Principles context

  ## Workflow

  1. **Extract Knowledge**: Run `extract-knowledge` to scan and index ML Principles PDFs
  2. **Explore Experts**: Use `list-experts` and `ask-expert` to understand available knowledge
  3. **Build Entry**: Use `build-entry` to create a competition strategy
  4. **Iterate**: Use `evolve` to run the convergence loop until state stabilizes

  ## Expert Structure
  Each expert has:
  - **Capabilities**: What the expert can do
  - **Skills**: Kaggle skills the expert recommends
  - **Strategy**: Step-by-step approach (Baseline → EDA → Feature Eng → Model → Submit)
  - **Formula**: Mathematical objective function
  - **Loop Config**: Convergence parameters (epsilon, max_iterations, patience)

  ## Convergence Loop
  Exit condition: `||state[n] - state[n-1]||_2 < epsilon`
  - Default epsilon: 0.001
  - Max iterations: 10
  - Patience: 3 consecutive converging iterations required
