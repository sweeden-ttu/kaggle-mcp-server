# MLSysEng MoE Skills Definition
# Source of truth for all platform skill configurations

name: mlsyseng-moe
version: "0.1.0"
description: >
  ML Systems Expert Mixture of Experts - extracts knowledge from ML Principles PDFs,
  registers chapter experts with skills/strategy/formulas, and builds Kaggle competition
  entries using RAG-informed skill selection with state convergence loops.

server:
  command: python
  args: ["-m", "mlsyseng_moe.server"]
  env:
    ML_PRINCIPLES_PATH: "${ML_PRINCIPLES_PATH:-~/Desktop/Machine Learning Principles - Chapters}"
    SQLITE_DB_PATH: "${SQLITE_DB_PATH:-~/.openclaw/workspace/mlsyseng/mlsyseng.db}"
    CHROMA_DB_PATH: "${CHROMA_DB_PATH:-~/.openclaw/workspace/mlsyseng/chroma_db}"
    KAGGLE_SKILLS_PATH: "${KAGGLE_SKILLS_PATH:-~/skills}"

tools:
  - name: extract-knowledge
    description: "Extract PDFs, index chapters, create experts"
    alias: evolve
    parameters:
      - name: force_reindex
        type: boolean
        default: false
        description: "Force re-extraction of all chapters"

  - name: search-concepts
    description: "Semantic search over ML Principles"
    parameters:
      - name: query
        type: string
        required: true
        description: "Search query for ML concepts"
      - name: n_results
        type: integer
        default: 5
        description: "Number of results to return"

  - name: list-experts
    description: "List all chapter experts"
    parameters: []

  - name: build-entry
    description: "Build competition entry using expert knowledge"
    parameters:
      - name: competition
        type: string
        required: true
        description: "Competition name or slug"
      - name: description
        type: string
        default: ""
        description: "Competition description"

  - name: evolve
    description: "Run convergence loop for competition"
    parameters:
      - name: competition
        type: string
        required: true
        description: "Competition name"
      - name: epsilon
        type: number
        default: 0.001
        description: "Convergence threshold"
      - name: max_iterations
        type: integer
        default: 10
        description: "Maximum iterations"
      - name: patience
        type: integer
        default: 3
        description: "Consecutive converging iterations required"

  - name: run-rdagent
    description: "Run rdagent with ML Principles context"
    parameters:
      - name: competition
        type: string
        required: true
      - name: description
        type: string
        default: ""

  - name: ask-expert
    description: "Query specific chapter expert"
    parameters:
      - name: expert_slug
        type: string
        required: true
        description: "Expert slug identifier"
      - name: question
        type: string
        required: true
        description: "Question to ask the expert"

  - name: get-extraction-status
    description: "Check extraction progress"
    parameters: []

  - name: get-stats
    description: "System statistics"
    parameters: []

skill:
  name: "MLSysEng MoE"
  instructions: |
    You have access to the MLSysEng Mixture of Experts system which provides:

    1. **Knowledge Extraction**: Extract ML principles from PDF chapters using docling
    2. **Expert System**: Query chapter-specific experts with domain knowledge
    3. **RAG Search**: Semantic search over ML principles knowledge base
    4. **Competition Building**: Generate Kaggle competition entries using expert knowledge
    5. **Convergence Loop**: Iterative refinement with L2-norm state convergence

    ## Workflow
    1. Use `extract-knowledge` to index ML principles chapters
    2. Use `search-concepts` to find relevant knowledge
    3. Use `build-entry` to create competition plans
    4. Use `evolve` to run the convergence loop

    ## Expert System
    Each chapter expert has:
    - Capabilities (what they can do)
    - Skills (Kaggle skill references)
    - Strategy (Baseline → EDA → Feature Eng → Model → Submit)
    - Formula (objective function with metrics)
    - Loop config (convergence parameters)

    ## Convergence
    The system exits when: ||state[n] - state[n-1]||_2 < epsilon
    Default epsilon: 0.001, patience: 3 consecutive converging iterations

platforms:
  openclaw:
    skill_path: "~/.openclaw/workspace/skills/mlsyseng/"
    config_path: "~/.openclaw/openclaw.json"
  claude_desktop:
    config_path: "~/Library/Application Support/Claude/claude_desktop_config.json"
  cursor:
    skill_path: "~/.cursor/skills/mlsyseng/"
  gemini:
    config_path: "~/.gemini/mcp_config.json"
  generic:
    skill_path: "~/.skills/mlsyseng/"
