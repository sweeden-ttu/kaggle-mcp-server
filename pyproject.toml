[project]
name = "kaggle-mcp-server"
version = "0.1.0"
description = "MCP server for Kaggle API and MLSysEng MoE - Mixture of Experts system for ML Principles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "kaggle>=1.6.0",
    "PyQt6>=6.6.0",
    "z3-solver>=4.13.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "PyYAML>=6.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
pdf = [
    "docling>=2.0.0",
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_mcp_server", "src/mlsyseng_mcp"]
