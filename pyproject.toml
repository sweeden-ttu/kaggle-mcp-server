[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsyseng-moe"
version = "1.0.0"
description = "Mixture of Experts system for ML Principles knowledge extraction and Kaggle competition entries"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "docling>=2.0.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19.0",
]

[project.scripts]
mlsyseng-mcp = "mlsyseng_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mlsyseng_mcp*"]
